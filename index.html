<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome To Web Astra Wijaya Mandala</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #000000;
            color: #ffffff;
        }
        /* Header dengan Judul dan Foto Pojok Kanan Atas */
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 2px solid #333;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        h1 {
            color: #ffffff;
            font-size: 24px;
            margin: 0;
        }
        .top-right-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #ffffff;
        }
        /* Tombol Join Grup */
        .button-container {
            text-align: center;
            margin: 25px 0;
        }
        .btn-join {
            background-color: #25D366; /* Warna khas WhatsApp */
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: inline-block;
            transition: background-color 0.3s;
        }
        .btn-join:hover {
            background-color: #1ebe5d;
        }
        /* Galeri */
        h2 {
            color: #ffffff;
            text-align: center;
            margin-top: 30px;
            letter-spacing: 1px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .gallery-grid img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #333;
            transition: transform 0.2s;
        }
        .gallery-grid img:hover {
            transform: scale(1.03);
        }
    </style>
</head>
